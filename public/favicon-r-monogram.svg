<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Background: rounded square in paper/cream -->
  <rect x="4" y="4" width="92" height="92" rx="22" fill="#f1eee4" />

  <!-- R letterform — geometric, bitcount-inspired pixel/block feel -->
  <!-- R vertical stem -->
  <rect x="32" y="22" width="10" height="56" rx="3" fill="#15171d" />
  <!-- R top horizontal + bowl top -->
  <rect x="42" y="22" width="28" height="10" rx="3" fill="#15171d" />
  <!-- R right vertical (bowl outer) -->
  <rect x="60" y="32" width="10" height="18" rx="3" fill="#15171d" />
  <!-- R middle horizontal -->
  <rect x="42" y="40" width="18" height="10" rx="3" fill="#15171d" />
  <!-- R leg (diagonal) -->
  <polygon points="42,50 52,50 72,78 60,78" fill="#15171d" />

  <!-- REC dot — inside the bowl -->
  <circle cx="52" cy="31" r="5" fill="#ff3b2f" />
</svg>